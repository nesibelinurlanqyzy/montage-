<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --blue:#2F7BFF; --cyan:#22D3FF; --pink:#FF2E93; --purple:#8B2CFF;
  --ink:#04050C; --white:#FFFFFF; --mute:#A9B0D6; --green:#2DA44E;
  --grad:linear-gradient(100deg,#22D3FF 0%,#2F7BFF 28%,#8B2CFF 62%,#FF2E93 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--ink);overflow:hidden}
body{font-family:"Noto Sans",sans-serif;color:#fff;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden;background:var(--ink)}
.abs{position:absolute}
/* ---------- фон ---------- */
.blob{position:absolute;border-radius:50%;filter:blur(120px);opacity:.55}
#floor{position:absolute;left:-1080px;width:3240px;height:1600px;top:1150px;
  transform-origin:50% 0;transform:perspective(900px) rotateX(74deg);
  background-image:linear-gradient(rgba(139,44,255,.55) 2px,transparent 2px),
                   linear-gradient(90deg,rgba(47,123,255,.45) 2px,transparent 2px);
  background-size:120px 120px;
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 75%)}
#horizon{position:absolute;left:0;right:0;top:1140px;height:6px;background:var(--grad);
  filter:blur(2px);box-shadow:0 0 60px 12px rgba(139,44,255,.55)}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.75) 100%)}
/* ---------- HUD ---------- */
#hud{position:absolute;left:80px;right:80px;top:200px;height:70px;opacity:0}
.seg{position:absolute;top:0;height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{position:absolute;inset:0;background:var(--grad);transform-origin:0 50%}
.brand{position:absolute;top:28px;left:0;font:800 26px "Noto Sans";letter-spacing:6px;color:var(--mute)}
.brand b{color:#fff}
/* ---------- типография ---------- */
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.glow{filter:drop-shadow(0 0 18px rgba(139,44,255,.85)) drop-shadow(0 0 50px rgba(255,46,147,.45))}
.w{display:inline-block;will-change:transform}
/* стекло */
.glass{background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.04));
  border:2px solid rgba(255,255,255,.18);border-radius:40px;
  box-shadow:0 30px 80px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.25);backdrop-filter:blur(24px)}

.gborder:before{content:"";position:absolute;inset:-2px;border-radius:inherit;padding:3px;background:var(--grad);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.mono{font-family:"JBM",monospace}
/* урок-заголовок */
.ltitle{position:absolute;left:80px;right:80px;top:300px}
.lnum{font:900 230px/1 "Noto Sans";letter-spacing:-8px;color:transparent;-webkit-text-stroke:5px #fff;opacity:.95}
.lnum.fill{-webkit-text-stroke:0;}
.lname{font:900 92px/1.02 "Noto Sans";letter-spacing:-2px;margin-top:6px}
.lname .k{color:var(--pink)}
.slash{color:var(--pink);font-weight:900}
.tag{display:inline-block;padding:14px 28px;border-radius:999px;font:800 30px "Noto Sans";letter-spacing:2px}
.cursor{position:absolute;width:70px;height:70px;filter:drop-shadow(0 0 14px rgba(255,46,147,.9)) drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.ripple{position:absolute;border-radius:50%;border:5px solid var(--cyan)}
.input{height:104px;border-radius:24px;background:rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.16);
  display:flex;align-items:center;padding:0 34px;font:700 38px "Noto Sans";color:#fff;gap:20px}
.input .lab{font:700 26px "Noto Sans";color:var(--mute);width:190px}
.ok{margin-left:auto;width:52px;height:52px;border-radius:50%;background:var(--green);display:grid;place-items:center;font:900 32px "Noto Sans"}
.btn{border-radius:26px;display:grid;place-items:center;font:900 44px "Noto Sans"}
.ph{position:absolute;border-radius:60px;border:6px solid rgba(255,255,255,.85);background:#0b0d1d;overflow:hidden;
  box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 60px rgba(139,44,255,.5)}
.placeholder{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.75);
  font:800 34px/1.3 "Noto Sans";border:4px dashed rgba(255,255,255,.35);border-radius:inherit;margin:14px}
</style></head>
<body><div id="stage">
  <div id="bg">
    <div class="blob" id="b1" style="width:900px;height:900px;background:#2F7BFF;left:-300px;top:-200px"></div>
    <div class="blob" id="b2" style="width:800px;height:800px;background:#8B2CFF;right:-300px;top:500px"></div>
    <div class="blob" id="b3" style="width:700px;height:700px;background:#FF2E93;left:100px;top:1300px;opacity:.35"></div>
    <div id="floor"></div><div id="horizon"></div>
  </div>
  <div id="scene" class="abs" style="inset:0"></div>
  <div id="hud">
    <div class="brand"><b>CLAUDE</b> МОНТАЖ · КУРС</div>
    <div class="brand" id="hudn" style="left:auto;right:0"></div>
  </div>
  <div id="fx" class="abs" style="inset:0;pointer-events:none"></div>
  <div id="vignette"></div><div id="grain"></div>
</div>
<script>
// ===== утилиты =====
const $=s=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));                  // 0..1 прогресс в окне
const eo=x=>1-Math.pow(1-x,3);                       // ease out cubic
const ex=x=>x>=1?1:1-Math.pow(2,-10*x);              // ease out expo
const eb=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}; // ease out back
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bump=(t,a,b)=>{const p=pr(t,a,b);return Math.sin(p*Math.PI)};
const lerp=(a,b,p)=>a+(b-a)*p;
const CUR=`<svg viewBox="0 0 24 24" width="70" height="70"><path d="M3 2l17 9-7.5 1.8L9 20z" fill="#fff" stroke="#04050C" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
let cur=null;
function build(id,html){ if(cur!==id){$('#scene').innerHTML=html;cur=id;} }
function S(sel,css){const e=typeof sel==='string'?$(sel):sel; if(e) Object.assign(e.style,css); return e;}
function hud(n,t0,t){ // n = 1..8 текущий урок
  const h=$('#hud'); h.style.opacity=n?1:0;
  if(!n) return;
  if(!h.dataset.b){h.dataset.b=1;for(let i=0;i<8;i++){const s=document.createElement('div');s.className='seg';
    s.style.left=(i*(920/8))+'px';s.style.width=(920/8-12)+'px';s.innerHTML='<i></i>';h.appendChild(s);}}
  [...h.querySelectorAll('.seg i')].forEach((e,i)=>{e.style.transform=`scaleX(${i<n-1?1:i==n-1?eo(pr(t,t0,t0+0.6)):0})`});
  $('#hudn').innerHTML=`<b style="color:#fff">0${n}</b> / 08`;
}
function bg(t,mode){
  S('#b1',{transform:`translate(${Math.sin(t*.6)*120}px,${Math.cos(t*.5)*90}px)`});
  S('#b2',{transform:`translate(${Math.cos(t*.4)*140}px,${Math.sin(t*.7)*120}px)`});
  S('#b3',{transform:`translate(${Math.sin(t*.5+1)*160}px,${Math.cos(t*.3)*80}px)`});
  S('#floor',{backgroundPosition:`0 ${t*260}px`,opacity:mode==='nofloor'?0:1});
  S('#horizon',{opacity:mode==='nofloor'?0:1});
}
function title(n,name,t,t0){ // заголовок урока: «01 / НАЗВАНИЕ»
  const p=ex(pr(t,t0,t0+.5)), q=eo(pr(t,t0+.15,t0+.65));
  return `<div class="ltitle">
    <div class="lnum" style="transform:translateX(${(1-p)*-300}px) skewX(${(1-p)*-20}deg);opacity:${p}">0${n}<span class="slash" style="-webkit-text-stroke:0;font-size:150px;vertical-align:40px;margin-left:24px">/</span></div>
    <div class="lname" style="transform:translateY(${(1-q)*80}px);opacity:${q};filter:blur(${(1-q)*14}px)">${name}</div></div>`;
}
// ===================== СЦЕНЫ =====================
// HOOK 0–3.0
function hook(t){
  build('hook',`
   <div id="streak" class="abs" style="top:760px;left:0;width:1400px;height:16px;background:linear-gradient(90deg,transparent,#22D3FF,#fff,#FF2E93,transparent);filter:blur(3px);box-shadow:0 0 60px 20px rgba(47,123,255,.6)"></div>
   <div id="flash" class="abs" style="inset:0;background:radial-gradient(circle at 50% 42%,rgba(120,170,255,.9),transparent 60%)"></div>
   <div id="pg" class="abs" style="left:0;right:0;top:560px;height:520px;transform-origin:50% 50%">
     <div id="pchip" class="abs glass" style="left:190px;right:190px;top:70px;height:380px;border-radius:70px;opacity:0"></div>
     <div id="neb" class="abs" style="left:0;right:0;top:0;text-align:center">
       <span style="position:relative;display:inline-block;padding:0 26px">
        <span id="hl" class="abs" style="left:0;right:0;top:14px;bottom:4px;background:var(--pink);border-radius:14px;transform-origin:0 50%"></span>
        <span style="position:relative;font:900 104px/1.1 'Noto Sans';letter-spacing:10px">НЕБӘРІ</span></span></div>
     <div id="ring" class="abs" style="left:540px;top:310px;width:600px;height:600px;margin:-300px;border-radius:50%;border:10px solid #22D3FF;box-shadow:0 0 50px #2F7BFF,inset 0 0 50px #FF2E93"></div>
     <div id="price" class="abs" style="left:0;right:0;top:140px;text-align:center;perspective:1200px;white-space:nowrap">
       <div id="ca1" class="abs" style="left:0;right:0;top:0;color:#22D3FF;mix-blend-mode:screen"></div>
       <div id="ca2" class="abs" style="left:0;right:0;top:0;color:#FF2E93;mix-blend-mode:screen"></div>
       <div id="pmain" class="glow" style="position:relative"></div>
     </div>
     <div id="parts" class="abs" style="left:540px;top:320px"></div>
   </div>
   <div id="q" class="abs" style="left:60px;right:60px;top:760px;text-align:center">
     <div style="font:900 158px/1 'Noto Sans';letter-spacing:-4px" class="glow"><span class="w grad-text" id="q1">CLAUDE</span></div>
     <div style="font:900 158px/1.02 'Noto Sans';letter-spacing:-4px" class="glow"><span class="w grad-text" id="q2">МОНТАЖ</span></div>
     <div style="font:800 82px/1.25 'Noto Sans';margin-top:18px"><span class="w" id="q3">КУРСЫНДА</span> <span class="w" id="q4">НЕ</span></div>
     <div style="font:900 118px/1.05 'Noto Sans';letter-spacing:-2px"><span class="w" id="q5">ҮЙРЕНЕСІҢ</span><span class="w" id="q6" style="color:var(--pink)">?</span></div>
   </div>
   <div id="fan" class="abs" style="left:0;right:0;top:1380px;height:200px;perspective:1400px"></div>
  `);
  if(!$('#fan').children.length){
    for(let i=0;i<8;i++){const d=document.createElement('div');d.className='abs glass';
      d.style.cssText+=`left:${540-70}px;top:0;width:140px;height:190px;border-radius:26px;display:grid;place-items:center;font:900 54px 'Noto Sans'`;
      d.innerHTML=`<span class="${i%2?'':'grad-text'}">0${i+1}</span>`;$('#fan').appendChild(d);}
    const digs=['3',' ','9','9','0',' ','₸'];
    const mk=()=>digs.map((c,i)=>`<span class="w d${i}" style="transform-origin:50% 70%">${c}</span>`).join('');
    ['#pmain','#ca1','#ca2'].forEach(s=>{$(s).innerHTML=mk();S(s,{font:"900 290px/1 'Noto Sans'",letterSpacing:'-8px'})});
    $('#pmain').querySelectorAll('.w').forEach(e=>e.classList.add('grad-text'));
    $('#pmain').querySelector('.d6').classList.remove('grad-text'); $('#pmain').querySelector('.d6').style.color='#FF2E93';
    let h='';for(let i=0;i<28;i++)h+=`<i class="abs" style="width:14px;height:14px;border-radius:50%;background:${['#22D3FF','#FF2E93','#8B2CFF','#fff'][i%4]};box-shadow:0 0 18px currentColor"></i>`;
    $('#parts').innerHTML=h;
  }
  bg(t,'');
  S('#streak',{transform:`translateX(${lerp(-1500,1300,eio(pr(t,0,.38)))}px)`,opacity:1-pr(t,.3,.42)});
  S('#flash',{opacity:bump(t,0,.35)*.9+bump(t,.72,1.0)*.55});
  // НЕБӘРІ
  const n=eb(pr(t,.15,.5)); S('#neb',{opacity:pr(t,.15,.3),transform:`translateY(${(1-n)*70}px) scale(${.8+.2*n})`,filter:`blur(${(1-pr(t,.15,.4))*16}px)`});
  S('#hl',{transform:`scaleX(${eo(pr(t,.38,.6))})`});
  // цифры: 3D flip по одному
  const order=[0,2,3,4,6];
  ['#pmain','#ca1','#ca2'].forEach((s,k)=>{
    order.forEach((di,j)=>{const a=.42+j*.07, p=pr(t,a,a+.32), e=eb(p);
      const el=$(s).querySelector('.d'+di);
      let tr=`translateY(${(1-e)*-220}px) rotateX(${(1-e)*-100}deg) scale(${.6+.4*e})`;
      if(di===6){const r=eo(pr(t,.7,1.15));tr=`rotateY(${(1-r)*540}deg) scale(${.4+.6*eb(pr(t,.7,1.05))})`;}
      S(el,{transform:tr,opacity:cl(p*3)});
    });
  });
  // chromatic aberration в момент удара
  const ca=Math.pow(1-pr(t,.8,1.15),2)*(t>.8?1:0)*26;
  S('#ca1',{transform:`translate(${-ca}px,${ca*.4}px)`,opacity:ca>0.5?.8:0});
  S('#ca2',{transform:`translate(${ca}px,${-ca*.4}px)`,opacity:ca>0.5?.8:0});
  // кольцо и частицы
  const r=pr(t,.8,1.35); S('#ring',{transform:`scale(${.2+2.4*eo(r)})`,opacity:t<.8?0:1-r});
  [...$('#parts').children].forEach((e,i)=>{const ang=i/28*Math.PI*2+i, sp=330+ (i*53%220), p=eo(pr(t,.82,1.6));
    S(e,{transform:`translate(${Math.cos(ang)*sp*p}px,${Math.sin(ang)*sp*p}px) scale(${1-p*.7})`,opacity:t<.82?0:1-pr(t,1.2,1.65)});});
  // пульс цены
  const pulse=1+.07*bump(t,.95,1.35)+.035*Math.sin(t*9)*pr(t,1.2,1.4)*(1-pr(t,1.5,1.7));
  // уход цены вверх в стеклянный чип
  const up=eio(pr(t,1.65,2.1));
  S('#pg',{transform:`translateY(${up*-430}px) scale(${pulse*(1-up*.55)})`});
  S('#pchip',{opacity:up*.95});
  // вопрос
  const words=[['#q1',1.9],['#q2',2.02],['#q3',2.25],['#q4',2.38],['#q5',2.5],['#q6',2.7]];
  words.forEach(([s,a])=>{const p=pr(t,a,a+.32),e=eb(p);
    S(s,{opacity:cl(p*2.5),transform:`translateY(${(1-e)*90}px) scale(${.7+.3*e}) rotateX(${(1-e)*60}deg)`,filter:`blur(${(1-cl(p*1.6))*12}px)`});});
  // ключевое слово меняет цвет и «прыгает»
  const k=pr(t,2.75,2.95); S('#q5',{color:k>0?`rgb(${lerp(255,255,k)},${lerp(255,46,k)},${lerp(255,147,k)})`:'#fff',
     transform:`scale(${1+.1*bump(t,2.75,3.05)})`});
  S('#q6',{transform:`translateY(${-30*bump(t,2.85,3.1)}px) rotate(${12*bump(t,2.85,3.1)}deg) scale(${pr(t,2.7,2.9)?eb(pr(t,2.7,3.0)):0})`});
  // веер 8 карточек-уроков
  [...$('#fan').children].forEach((e,i)=>{const a=2.3+i*.05,p=eb(pr(t,a,a+.4)), off=(i-3.5);
    S(e,{transform:`translateX(${off*118*p}px) translateY(${(1-p)*200+Math.abs(off)*14}px) rotateY(${off*-8}deg) rotateZ(${off*4*p}deg)`,opacity:cl(p*2)});});
  hud(0);
}
// переход «удар зума» между сценами
function zoomOut(t,a){ const p=pr(t,a,a+.28); S('#scene',{transform:`scale(${1+eio(p)*2.2})`,filter:`blur(${p*30}px)`,opacity:1-pr(t,a+.12,a+.28)}); S('#fx',{background:`rgba(150,190,255,${bump(t,a+.1,a+.4)*.7})`});}
function sceneIn(t,a){ const p=ex(pr(t,a,a+.35)); S('#scene',{transform:`scale(${1.35-.35*p})`,filter:`blur(${(1-p)*20}px)`,opacity:p});}

// 01 GitHub 3–7
function s01(t){ const T=t-3;
  build('s01',`${''}<div id="tt"></div>
   <div id="card" class="abs glass gborder" style="left:120px;right:120px;top:860px;height:780px;transform-style:preserve-3d">
     <div style="display:flex;gap:14px;padding:30px 34px"><i style="width:22px;height:22px;border-radius:50%;background:#ff5f57"></i><i style="width:22px;height:22px;border-radius:50%;background:#febc2e"></i><i style="width:22px;height:22px;border-radius:50%;background:#28c840"></i>
       <span class="mono" style="margin-left:24px;font-size:28px;color:var(--mute)">github.com/signup</span></div>
     <div style="display:flex;align-items:center;gap:26px;padding:10px 54px 30px">
       <div style="width:110px;height:110px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;font:900 30px 'Noto Sans';text-align:center;line-height:1">лого<br>GitHub</div>
       <div style="font:900 52px 'Noto Sans'">Create your account</div></div>
     <div style="padding:0 54px;display:grid;gap:22px">
       <div class="input" id="i1"><span class="lab">Email</span><span>aktoty@mail.kz</span><span class="ok">✓</span></div>
       <div class="input" id="i2"><span class="lab">Password</span><span>••••••••••</span><span class="ok">✓</span></div>
       <div class="input" id="i3"><span class="lab">Username</span><span id="typ"></span><span id="caret" style="width:4px;height:48px;background:var(--cyan)"></span></div>
       <div class="btn" id="cbtn" style="height:110px;background:var(--grad);margin-top:8px">Continue →</div>
     </div></div>
   <div id="c1" class="cursor">${CUR}</div><div id="rp" class="ripple"></div>`);
  bg(t,'nofloor'); hud(1,3,t);
  $('#tt').innerHTML=title(1,'GITHUB-ҚА<br><span class="k">ТІРКЕЛУ</span>',t,3.05);
  const c=eb(pr(T,.2,.75)); S('#card',{transform:`perspective(1600px) translateY(${(1-c)*500}px) rotateX(${(1-c)*35+4*Math.sin(T*1.3)}deg) rotateY(${1.5*Math.sin(T)}deg)`,opacity:cl(c*2)});
  const u='aktoty-montazh'; $('#typ').textContent=u.slice(0,Math.floor(pr(T,1.1,2.3)*u.length));
  S('#caret',{opacity:Math.floor(T*4)%2});
  ['#i1','#i2'].forEach((s,i)=>S($(s).querySelector('.ok'),{transform:`scale(${eb(pr(T,.7+i*.2,1+i*.2))})`}));
  const cx=lerp(900,560,eio(pr(T,2.3,3.0))), cy=lerp(1900,1600,eio(pr(T,2.3,3.0)));
  S('#c1',{left:cx+'px',top:cy+'px',transform:`scale(${1-.15*bump(T,3.0,3.2)})`});
  const rp=pr(T,3.05,3.5); S('#rp',{left:cx-10+'px',top:cy-10+'px',width:'20px',height:'20px',transform:`scale(${1+rp*12})`,opacity:T<3.05?0:1-rp});
  S('#cbtn',{transform:`scale(${1-.05*bump(T,3.0,3.25)})`,boxShadow:`0 0 ${80*bump(T,3,3.6)}px rgba(255,46,147,.9)`});
}
// 02 Репозиторий 7–11
function s02(t){ const T=t-7;
  build('s02',`<div id="tt"></div>
   <div id="newb" class="abs btn" style="left:120px;top:880px;width:340px;height:120px;background:var(--green);font-size:48px;box-shadow:0 0 50px rgba(45,164,78,.6)">＋ New</div>
   <div id="rname" class="abs glass" style="left:500px;right:80px;top:880px;height:120px;border-radius:26px;display:flex;align-items:center;padding:0 30px" ><span class="mono" style="font-size:34px">montazh-<b style="color:var(--cyan)">reels</b></span></div>
   <div id="tree" class="abs" style="left:120px;right:80px;top:1060px;perspective:1600px"></div>
   <div id="c1" class="cursor">${CUR}</div><div id="rp" class="ripple"></div>`);
