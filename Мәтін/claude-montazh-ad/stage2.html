<!doctype html>
<html lang="kk"><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
/* «NEON STUDIO» — референстер негізінде: rim-light телефон + неон толқын + plexus */
:root{
  --cyan:#19E6FF; --blue:#2F6BFF; --purple:#9B30FF; --pink:#FF2BD6; --white:#fff; --ink:#02030A; --navy:#050A24; --mute:#9AA3D0;
  --grad:linear-gradient(100deg,#19E6FF 0%,#2F6BFF 30%,#9B30FF 62%,#FF2BD6 100%);
  --rim:linear-gradient(100deg,#19E6FF 0%,#4F8BFF 35%,#A63BFF 68%,#FF2BD6 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;background:var(--ink);overflow:hidden}
body{font-family:"Noto Sans",sans-serif;color:#fff}
#stage{position:absolute;inset:0;overflow:hidden;background:radial-gradient(ellipse 120% 70% at 50% 42%,#0A1240 0%,#050A24 38%,#02030A 75%)}
.abs{position:absolute}
#floor{position:absolute;left:0;right:0;top:1560px;bottom:0;background:linear-gradient(#0a0c1c,#02030A 70%)}
#floorglow{position:absolute;left:140px;right:140px;top:1520px;height:220px;border-radius:50%;
  background:radial-gradient(ellipse at 30% 50%,rgba(25,230,255,.45),transparent 60%),radial-gradient(ellipse at 72% 50%,rgba(255,43,214,.5),transparent 60%);filter:blur(30px)}
#bokeh i{position:absolute;border-radius:50%;filter:blur(2px)}
#plex{position:absolute;left:0;top:0}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent 50%,rgba(0,0,0,.7) 100%);pointer-events:none}
#grain{position:absolute;inset:0;opacity:.06;mix-blend-mode:overlay;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
/* HUD */
#hud{position:absolute;left:80px;right:80px;top:200px;height:70px;opacity:0}
.seg{position:absolute;top:0;height:8px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden}
.seg i{position:absolute;inset:0;background:var(--grad);transform-origin:0 50%;box-shadow:0 0 12px #9B30FF}
.brand{position:absolute;top:28px;left:0;font:800 26px "Noto Sans";letter-spacing:6px;color:var(--mute)}
/* текст */
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.glow{filter:drop-shadow(0 0 16px rgba(155,48,255,.9)) drop-shadow(0 0 46px rgba(255,43,214,.45))}
.w{display:inline-block}
.ltitle{position:absolute;left:80px;right:80px;top:300px}
.lnum{font:900 210px/1 "Noto Sans";letter-spacing:-8px;color:transparent;-webkit-text-stroke:4px #fff;filter:drop-shadow(0 0 14px rgba(25,230,255,.8))}
.lname{font:900 88px/1.02 "Noto Sans";letter-spacing:-2px;margin-top:6px}
.lname .k{color:var(--pink);text-shadow:0 0 30px rgba(255,43,214,.8)}
.tag{display:inline-block;padding:12px 26px;border-radius:999px;font:800 28px "Noto Sans"}
.mono{font-family:"JBM",monospace}
/* телефон с rim light (реф. 1) */
.rig{position:absolute;transform-style:preserve-3d}
.phone{position:absolute;border-radius:92px;padding:9px;background:var(--rim);
  box-shadow:-26px 0 70px rgba(25,230,255,.5),26px 0 70px rgba(255,43,214,.55),0 60px 120px rgba(0,0,0,.85);
  -webkit-box-reflect:below 26px linear-gradient(transparent 74%,rgba(255,255,255,.22))}
.scr{position:relative;width:100%;height:100%;border-radius:84px;background:#060814;overflow:hidden}
.island{position:absolute;left:50%;top:24px;width:150px;height:44px;margin-left:-75px;border-radius:22px;background:#000;z-index:5}
.sbar{position:absolute;left:44px;right:44px;top:30px;display:flex;justify-content:space-between;font:800 26px "Noto Sans";z-index:4}
/* стекло «вылетающее из экрана» (реф. 1, бирюзовая карточка) */
.pop{position:absolute;border-radius:30px;background:linear-gradient(150deg,rgba(25,230,255,.42),rgba(25,230,255,.12));
  border:2px solid rgba(160,250,255,.75);box-shadow:0 0 50px rgba(25,230,255,.55),0 30px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.6);
  backdrop-filter:blur(14px);color:#fff}
.pop.pk{background:linear-gradient(150deg,rgba(255,43,214,.42),rgba(255,43,214,.12));border-color:rgba(255,170,240,.75);box-shadow:0 0 50px rgba(255,43,214,.55),0 30px 60px rgba(0,0,0,.6)}
.pop.vi{background:linear-gradient(150deg,rgba(155,48,255,.45),rgba(155,48,255,.12));border-color:rgba(210,160,255,.75);box-shadow:0 0 50px rgba(155,48,255,.6),0 30px 60px rgba(0,0,0,.6)}
.thumb{border-radius:22px;border:3px solid rgba(25,230,255,.9);box-shadow:0 0 18px rgba(25,230,255,.6);background:linear-gradient(150deg,#1b2a5a,#3a1450)}
.cursor{position:absolute;width:64px;height:64px;filter:drop-shadow(0 0 14px rgba(255,43,214,.9)) drop-shadow(0 6px 10px rgba(0,0,0,.6));z-index:20}
.ripple{position:absolute;border-radius:50%;border:5px solid var(--cyan);z-index:19}
.dia{position:absolute;width:30px;height:30px;transform:rotate(45deg);background:#fff;box-shadow:0 0 16px #19E6FF,0 0 30px #19E6FF;border-radius:4px}
.knob{position:absolute;height:34px;border-radius:17px}
.placeholder{position:absolute;inset:14px;display:grid;place-items:center;text-align:center;color:rgba(255,255,255,.8);
  font:800 30px/1.3 "Noto Sans";border:4px dashed rgba(255,255,255,.35);border-radius:70px}
.bar{position:absolute;width:24px;border-radius:12px;transform-origin:50% 50%}
</style></head>
<body><div id="stage">
  <div id="bokeh" class="abs" style="inset:0"></div>
  <div id="floorglow"></div><div id="floor"></div>
  <canvas id="plex" width="1080" height="1920"></canvas>
  <div id="scene" class="abs" style="inset:0"></div>
  <div id="hud"><div class="brand"><b style="color:#fff">CLAUDE</b> МОНТАЖ · КУРС</div><div class="brand" id="hudn" style="left:auto;right:0"></div></div>
  <div id="fx" class="abs" style="inset:0;pointer-events:none"></div>
  <div id="vignette"></div><div id="grain"></div>
</div>
<script>
const $=s=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const pr=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), ex=x=>x>=1?1:1-Math.pow(2,-10*x);
const eb=x=>{const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const bump=(t,a,b)=>Math.sin(pr(t,a,b)*Math.PI);
const lerp=(a,b,p)=>a+(b-a)*p;
function rnd(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const CUR=`<svg viewBox="0 0 24 24" width="64" height="64"><path d="M3 2l17 9-7.5 1.8L9 20z" fill="#fff" stroke="#02030A" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
let cur=null;
function build(id,html,init){ if(cur!==id){$('#scene').innerHTML=html;cur=id;if(init)init();} }
function S(sel,css){const e=typeof sel==='string'?$(sel):sel; if(e) Object.assign(e.style,css); return e;}
// цвет бара: cyan → white → magenta (реф. 2)
function barCol(u){const st=[[25,230,255],[120,220,255],[255,255,255],[200,120,255],[255,43,214]];const x=u*(st.length-1),i=Math.min(st.length-2,Math.floor(x)),f=x-i;
  const c=st[i].map((v,k)=>Math.round(lerp(v,st[i+1][k],f)));return `rgb(${c})`;}
// ---------- фон: боке + plexus ----------
(function(){const r=rnd(7);let h='';for(let i=0;i<34;i++){const s=6+r()*18,c=['#19E6FF','#2F6BFF','#FF2BD6','#9B30FF'][i%4];
  h+=`<i data-x="${r()*1080}" data-y="${r()*1500+100}" data-s="${r()}" style="width:${s}px;height:${s}px;background:${c};box-shadow:0 0 ${s*2}px ${c};opacity:${.25+r()*.5}"></i>`;}
  $('#bokeh').innerHTML=h;})();
function bg(t){[...$('#bokeh').children].forEach(e=>{const s=+e.dataset.s;S(e,{left:(+e.dataset.x+Math.sin(t*.5+s*9)*30)+'px',top:(+e.dataset.y-t*20*(0.5+s))%1700+'px'})});}
const PL=(()=>{const r=rnd(42),a=[];for(let i=0;i<110;i++){const g=(r()+r()+r()-1.5)/1.5;a.push({x:r(),y:g,v:r(),ph:r()*6.28})}return a})();
// plexus вокруг горизонтальной линии (реф. 2): cy центр, spread высота, boom — разлёт
function plexus(t,cy,spread,alpha,boom=0,x0=0,x1=1080){
  const c=$('#plex').getContext('2d');c.clearRect(0,0,1080,1920);if(alpha<=0.01)return;
  const pts=PL.map(p=>{const px=lerp(x0,x1,p.x),dx=px-540;return{x:px+dx*boom*.9+Math.sin(t*1.3+p.ph)*14,
     y:cy+p.y*spread*(1+boom*2.2)+Math.cos(t*1.1+p.ph)*12,u:p.x}});
  c.globalCompositeOperation='lighter';
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const a=pts[i],b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
    if(d<95){c.strokeStyle=barCol(a.u).replace('rgb','rgba').replace(')',`,${alpha*(1-d/95)*.8})`);c.lineWidth=2;c.beginPath();c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);c.stroke();}}
  pts.forEach(p=>{c.fillStyle=barCol(p.u);c.globalAlpha=alpha;c.shadowColor=barCol(p.u);c.shadowBlur=14;c.beginPath();c.arc(p.x,p.y,3.6,0,7);c.fill();});
  c.globalAlpha=1;c.shadowBlur=0;
}
// неон-бары (реф. 2): el — контейнер, n — кол-во, amp — высота 0..1
function barsInit(el,n,w,gap,H){let h='';for(let i=0;i<n;i++){const u=i/(n-1),col=barCol(u);
  h+=`<i class="bar" style="left:${i*(w+gap)}px;width:${w}px;top:${H/2}px;background:linear-gradient(90deg,${col},#fff 50%,${col});box-shadow:0 0 18px ${col},0 0 46px ${col}"></i>`;}
  el.innerHTML=h;el.dataset.H=H;}
function barsSet(el,t,amp,seed=0,shape=1){const n=el.children.length,H=+el.dataset.H;[...el.children].forEach((b,i)=>{const u=i/(n-1)-.5;
  const env=shape?Math.exp(-u*u*9):1, v=.45+.55*Math.abs(Math.sin(t*7.3+i*.9+seed)*Math.cos(t*3.1+i*.37));
  const h=Math.max(8,H*amp*env*v);S(b,{height:h+'px',top:(H/2-h/2)+'px'});});}
function phone(id,w,h,screen){return `<div class="phone" id="${id}" style="width:${w}px;height:${h}px"><div class="scr"><div class="island"></div>
  <div class="sbar"><span>9:41</span><span style="letter-spacing:4px">▮▮▮</span></div>${screen}</div></div>`;}
function hud(n,t0,t){const h=$('#hud');h.style.opacity=n?1:0;if(!n)return;
  if(!h.dataset.b){h.dataset.b=1;for(let i=0;i<8;i++){const s=document.createElement('div');s.className='seg';s.style.left=(i*115)+'px';s.style.width='103px';s.innerHTML='<i></i>';h.appendChild(s);}}
  [...h.querySelectorAll('.seg i')].forEach((e,i)=>{e.style.transform=`scaleX(${i<n-1?1:i==n-1?eo(pr(t,t0,t0+.6)):0})`});
  $('#hudn').innerHTML=`<b style="color:#fff">0${n}</b> / 08`;}
function title(n,name,t,t0){const p=ex(pr(t,t0,t0+.5)),q=eo(pr(t,t0+.15,t0+.65));
  return `<div class="ltitle"><div class="lnum" style="transform:translateX(${(1-p)*-300}px) skewX(${(1-p)*-20}deg);opacity:${p}">0${n}<span style="color:var(--pink);-webkit-text-stroke:0;font-size:140px;vertical-align:36px;margin-left:22px">/</span></div>
  <div class="lname" style="transform:translateY(${(1-q)*80}px);opacity:${q};filter:blur(${(1-q)*14}px)">${name}</div></div>`;}
function cursorAt(t,a,b,x0,y0,x1,y1,click){const p=eio(pr(t,a,b)),x=lerp(x0,x1,p),y=lerp(y0,y1,p);S('#cur',{left:x+'px',top:y+'px',opacity:pr(t,a-.2,a)});
  const r=pr(t,click,click+.45);S('#rip',{left:x-10+'px',top:y-10+'px',width:'20px',height:'20px',transform:`scale(${1+r*10})`,opacity:t<click?0:1-r});}

// ================= HOOK 0–3 =================
function hook(t){
  build('hook',`
   <div id="hline" class="abs" style="left:0;right:0;top:817px;height:6px;background:linear-gradient(90deg,transparent,#19E6FF 20%,#fff 50%,#FF2BD6 80%,transparent);box-shadow:0 0 30px 6px rgba(160,140,255,.8)"></div>
   <div id="bars" class="abs" style="left:${540-(31*34-10)/2}px;top:${820-360}px;width:${31*34}px;height:720px"></div>
   <div id="neb" class="abs" style="left:0;right:0;top:560px;text-align:center;font:900 96px/1 'Noto Sans';letter-spacing:14px;text-shadow:0 0 24px rgba(255,43,214,.9),0 0 60px rgba(155,48,255,.8)"></div>
   <div id="pg" class="abs" style="left:0;right:0;top:640px;height:360px">
     <div id="chip" class="abs pop vi" style="left:220px;right:220px;top:-120px;height:540px;border-radius:80px;opacity:0"></div>
     <div id="ring" class="abs" style="left:540px;top:180px;width:600px;height:600px;margin:-300px;border-radius:50%;border:8px solid #fff;box-shadow:0 0 40px #19E6FF,inset 0 0 40px #FF2BD6;opacity:0"></div>
     <div id="price" class="abs" style="left:0;right:0;top:20px;text-align:center;white-space:nowrap">
       <div id="ca1" class="abs" style="left:0;right:0;top:0;color:#19E6FF;mix-blend-mode:screen"></div>
       <div id="ca2" class="abs" style="left:0;right:0;top:0;color:#FF2BD6;mix-blend-mode:screen"></div>
       <div id="pmain" class="glow" style="position:relative"></div>
       <div id="spec" class="abs" style="left:0;right:0;top:0;color:#fff"></div>
     </div></div>
   <div id="q" class="abs" style="left:50px;right:50px;top:470px;text-align:center">
     <div style="font:900 134px/1 'Noto Sans';letter-spacing:-4px" class="glow"><span class="w grad-text" id="q1">CLAUDE</span> </div>
     <div style="font:900 134px/1.02 'Noto Sans';letter-spacing:-4px" class="glow"><span class="w grad-text" id="q2">МОНТАЖ</span></div>
     <div style="font:800 76px/1.3 'Noto Sans';margin-top:14px"><span class="w" id="q3">КУРСЫНДА</span> <span class="w" id="q4">НЕ</span></div>
     <div style="font:900 108px/1.05 'Noto Sans';letter-spacing:-2px"><span class="w" id="q5">ҮЙРЕНЕСІҢ</span><span class="w" id="q6" style="color:var(--pink)">?</span></div></div>
   <div id="hrig" class="rig" style="left:305px;top:1080px;width:470px;height:960px">
     ${phone('hp',470,960,`<div id="grid" class="abs" style="left:34px;right:34px;top:110px;display:grid;grid-template-columns:1fr 1fr;gap:22px"></div>`)}</div>
  `,()=>{
    barsInit($('#bars'),31,24,10,720);
    const digs=['3',' ','9','9','0',' ','₸'];
    const mk=()=>digs.map((c,i)=>`<span class="w d${i}" style="transform-origin:50% 55%">${c}</span>`).join('');
    ['#pmain','#ca1','#ca2','#spec'].forEach(s=>{$(s).innerHTML=mk();S(s,{font:"900 300px/1 'Noto Sans'",letterSpacing:'-8px'})});
    $('#pmain').querySelectorAll('.w').forEach((e,i)=>{if(i<6)e.classList.add('grad-text')});
    S($('#pmain').querySelector('.d6'),{color:'#FF2BD6',textShadow:'0 0 40px #FF2BD6'});
    $('#neb').innerHTML=[...'НЕБӘРІ'].map(c=>`<span class="w">${c}</span>`).join('');
    let g='';for(let i=0;i<8;i++)g+=`<div class="thumb" style="height:150px;display:grid;place-items:center;font:900 54px 'Noto Sans'"><span class="${i%2?'':'grad-text'}">0${i+1}</span></div>`;$('#grid').innerHTML=g;
  });
  bg(t);
  // 1) световая линия
  S('#hline',{transform:`scaleX(${eo(pr(t,0,.3))})`,opacity:(1-pr(t,1.6,1.9))*(1-.6*bump(t,.95,1.2))});
  // 2) неон-бары вырастают из линии, потом схлопываются в цифры
  const amp=eb(pr(t,.12,.55))*(1-eio(pr(t,.8,1.0)));
  barsSet($('#bars'),t,amp,0,1); S('#bars',{opacity:amp>0.01?1:0});
  plexus(t,820,190,pr(t,.15,.45)*(1-pr(t,1.5,2.0)),ex(pr(t,.98,1.8)));
  // 3) НЕБӘРІ — буквы «впечатываются»
  [...$('#neb').children].forEach((e,i)=>{const p=pr(t,.32+i*.05,.55+i*.05);S(e,{opacity:p,transform:`scale(${lerp(2.4,1,eo(p))})`,filter:`blur(${(1-p)*14}px)`})});
  S('#neb',{transform:`translateY(${-60*eio(pr(t,.95,1.1))}px)`, opacity:1-pr(t,1.65,1.8)});
  // 4) цена рождается из схлопнувшихся баров
  ['#pmain','#ca1','#ca2','#spec'].forEach(s=>[0,2,3,4,6].forEach((di,j)=>{const a=.95+j*.035,p=pr(t,a,a+.28),el=$(s).querySelector('.d'+di);
    let tr=`scaleY(${eb(p)}) scaleX(${lerp(.35,1,eo(p))})`;
    if(di===6){const r=eo(pr(t,1.05,1.45));tr=`rotateY(${(1-r)*720}deg) scale(${eb(pr(t,1.05,1.35))})`;}
    S(el,{transform:tr,opacity:cl(p*4)});}));
  const ca=t>.98?Math.pow(1-pr(t,.98,1.3),2)*30:0;
  S('#ca1',{transform:`translate(${-ca}px,${ca*.3}px)`,opacity:ca>.5?.85:0});S('#ca2',{transform:`translate(${ca}px,${-ca*.3}px)`,opacity:ca>.5?.85:0});
  // блик-sweep по цифрам
  const sw=pr(t,1.35,1.75)*160-30;S('#spec',{WebkitMaskImage:`linear-gradient(105deg,transparent ${sw-12}%,#000 ${sw}%,transparent ${sw+12}%)`,opacity:t>1.35&&t<1.75?.95:0});
  S('#ring',{transform:`scale(${.15+2.5*eo(pr(t,1.0,1.5))})`,opacity:t<1?0:1-pr(t,1.0,1.5)});
  S('#fx',{background:`radial-gradient(circle at 50% 43%,rgba(200,220,255,${bump(t,.95,1.15)*.85}),transparent 65%)`});
  const sh=t>.98&&t<1.25?(1-pr(t,.98,1.25))*14:0;
  const pulse=1+.06*bump(t,1.15,1.5);
  const up=eio(pr(t,1.7,2.1));
  S('#pg',{transform:`translate(${Math.sin(t*90)*sh}px,${Math.cos(t*77)*sh-up*440}px) scale(${pulse*(1-up*.6)})`});
  S('#chip',{opacity:up});
  // 5) телефон поднимается снизу (реф. 1)
  const ph=eo(pr(t,1.8,2.45));
  S('#hrig',{transform:`perspective(1800px) translateY(${(1-ph)*900}px) rotateY(${lerp(-35,-14,ph)+3*Math.sin(t*1.5)}deg) rotateX(${lerp(20,6,ph)}deg)`});
  [...$('#grid').children].forEach((e,i)=>{const p=eb(pr(t,2.2+i*.05,2.55+i*.05));S(e,{transform:`scale(${p})`,opacity:cl(p*2)})});
  // 6) вопрос
  [['#q1',1.95],['#q2',2.07],['#q3',2.28],['#q4',2.4],['#q5',2.5],['#q6',2.7]].forEach(([s,a])=>{const p=pr(t,a,a+.3),e=eb(p);
    S(s,{opacity:cl(p*2.5),transform:`translateY(${(1-e)*90}px) scale(${.7+.3*e})`,filter:`blur(${(1-cl(p*1.6))*12}px)`});});
  const k=pr(t,2.72,2.9);S('#q5',{color:`rgb(255,${Math.round(lerp(255,43,k))},${Math.round(lerp(255,214,k))})`,textShadow:`0 0 ${30*k}px rgba(255,43,214,.9)`});
  S('#q6',{transform:`translateY(${-30*bump(t,2.8,3.0)}px) rotate(${14*bump(t,2.8,3.0)}deg) scale(${eb(pr(t,2.7,2.95))})`});
  hud(0);
}
// ======== переходы ========
function intoScreen(t,a,ox,oy){const p=pr(t,a,a+.3);S('#scene',{transformOrigin:`${ox}px ${oy}px`,transform:`scale(${1+eio(p)*3.5})`,filter:`blur(${p*24}px)`,opacity:1-pr(t,a+.18,a+.3)});
