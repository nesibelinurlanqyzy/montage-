<script>
const $=(s,r=document)=>r.querySelector(s);

const T=(h)=>`<div class="ttl">${h}</div>`;

 return (step?`<div class="step">${step}</div>`:'')+`<div class="tt">${ws.join(' ')}</div>`;};

}
function wtime(s,key){ if(typeof key==='number') return s.t0+key; for(const w of s.words){ if(w.w.toLowerCase().includes(key)) return w.t; } return s.t0+0.2; }
function chunks(ws){const out=[];let cur=[],len=0;ws.forEach((w,j)=>{const L=(w.w+(w.p||'')).length;if(cur.length&&len+L+1>24){out.push(cur);cur=[];len=0}cur.push(j);len+=L+1;
 if(/[.,?!]$/.test(w.w+(w.p||''))&&len>12){out.push(cur);cur=[];len=0}});if(cur.length)out.push(cur);return out;}
const BL=[[[-20,40],[110,-40],[180,-60]],[[200,60],[20,-50],[-90,20]],[[60,80],[230,-30],[150,40]]];
function setup(data){
 D=data; const root=$('#scenes');
 D.scenes.forEach((s,i)=>{
  const div=document.createElement('div'); div.className='scene'; div.style.display='none';
  const [html,els]=card(s.card); div.innerHTML=html; root.appendChild(div);
  s.div=div; s.tws=[...div.querySelectorAll('.tw')];
  s.els=els.map(([sel,key,kind])=>({el:div.querySelector(sel),t:wtime(s,key),kind:kind||'pop'}));
  div.querySelectorAll('.step').forEach(e=>s.els.push({el:e,t:s.t0+0.05,kind:'fade'}));
  s.ch=chunks(s.words);
 });
 window.READY=true;
}
function env(t){const i=Math.floor(t*D.fps);return D.env[Math.max(0,Math.min(D.env.length-1,i))]||0}
const POSE={ // [upperR, foreR, upperL, foreL, handR, handL]
 talk:[-22,-72,10,-118,'open','phone'], point:[-150,-12,10,-118,'point','phone'], wave:[-128,-30,10,-118,'open','phone'],
 thumb:[-24,-100,10,-118,'thumb','phone'], wow:[-32,-128,32,128,'open','open'], down:[-28,-22,10,-118,'point','phone']};
function hands(g,k){['Open','Point','Thumb','Phone'].forEach(n=>g.querySelectorAll('.h'+n).forEach(e=>e.style.display=(k===n.toLowerCase())?'':'none'));}
function drawArm(id,sx,sy,u,f,hk){const g=$(id),r=Math.PI/180;
 const ex=sx-38*Math.sin(u*r), ey=sy+38*Math.cos(u*r), a2=u+f, hx=ex-32*Math.sin(a2*r), hy=ey+32*Math.cos(a2*r);
 const d=`M${sx} ${sy} L${ex} ${ey} L${hx} ${hy}`; g.querySelector('.aO').setAttribute('d',d); g.querySelector('.aF').setAttribute('d',d);
 const h=g.querySelector('.hand'); h.setAttribute('transform',`translate(${hx-4*Math.sin(a2*r)} ${hy+4*Math.cos(a2*r)}) rotate(${hk==='thumb'||hk==='phone'?0:a2})`);
 ['Open','Point','Thumb','Phone','PhoneF'].forEach(n=>h.querySelectorAll('.h'+n).forEach(e=>e.style.display=(hk===n.toLowerCase()||(n==='PhoneF'&&hk==='phone'))?'':'none'));}
function drawPerson(t,si,sceneT){
 const a=env(t), a2=env(t-0.05), m=Math.max(a,a2*0.8), open=0.5+9*m;
 $('#pmouth').setAttribute('d',`M172 423 Q180 ${426+open} 188 423 Q180 ${424+open*0.15} 172 423Z`);
 const blink=((t+0.7)%3.3)<0.12; $('#peyes').style.display=blink?'none':''; $('#plids').style.display=blink?'':'none';
 const pose=D.scenes[si].pose||'talk', prev=si?(D.scenes[si-1].pose||'talk'):pose;
 const P1=POSE[pose]||POSE.talk, P0=POSE[prev]||POSE.talk, k=si?eob(clamp(sceneT/0.45)):1;
 const L=(i)=>P0[i]+(P1[i]-P0[i])*k;
 let uR=L(0),fR=L(1),uL=L(2),fL=L(3);
 if(pose==='wave'){fR+=Math.sin(t*9)*22;}
 if(pose==='talk'){fR+=Math.sin(t*3.2)*10-a*12; uR+=Math.sin(t*1.7)*4;}
 if(pose==='point'||pose==='down'){uR+=Math.sin(t*4)*2;}
 if(pose==='thumb'){fR+=Math.sin(t*5)*4;}
 if(pose==='wow'){fR+=Math.sin(t*7)*8; fL-=Math.sin(t*7)*8;}
 drawArm('#pR',212,464,uR,fR,k<0.5?P0[4]:P1[4]); drawArm('#pL',148,464,uL,fL,k<0.5?P0[5]:P1[5]);
 const hr=Math.sin(t*2.1)*3+(a-0.3)*4, hy=Math.sin(t*4.2)*0.8-a*2;
 $('#phead').setAttribute('transform',`translate(0 ${hy}) rotate(${hr} 180 440)`);
 $('#ptail').setAttribute('transform',`rotate(${Math.sin(t*2.6)*5-hr*0.6} 204 372)`);
 const jump=si&&sceneT<0.35?Math.sin(sceneT/0.35*Math.PI)*5:0;
 $('#pall').setAttribute('transform',`translate(0 ${Math.sin(t*1.6)*1.2-jump}) rotate(${Math.sin(t*1.3)*1.2} 180 630)`);
}

function draw(t){
 let cur=0; D.scenes.forEach((s,i)=>{ if(t>=s.t0) cur=i; });
 $('#prog').style.width=(clamp(t/D.dur)*360)+'px';
 const S=D.scenes[cur];
 // blobs drift
 const bl=BL[cur%3], bp=eo(clamp((t-S.t0)/0.6)), pb=BL[(cur+2)%3];
 ['#b1','#b2','#a1'].forEach((id,k)=>{const x=pb[k][0]+(bl[k][0]-pb[k][0])*(cur?bp:1)+Math.sin(t*0.6+k)*6, y=pb[k][1]+(bl[k][1]-pb[k][1])*(cur?bp:1)+Math.cos(t*0.5+k)*5;$(id).style.left=x+'px';$(id).style.top=y+'px';});
 const pin=eob(clamp(t/0.5)); $('#panel').style.transform=`translateY(${(1-pin)*-30}px) scale(${0.9+0.1*pin})`; $('#panel').style.opacity=clamp(t/0.2);
 D.scenes.forEach((s,i)=>{
  if(i!==cur){s.div.style.display='none';return}
  s.div.style.display='';
  const xo=clamp((t-(s.t1-0.18))/0.18), xi=clamp((t-s.t0)/0.25);
  s.div.style.opacity=(1-xo)*(i?eo(xi):1); s.div.style.transform=`translateX(${(1-eo(xi))*(i?18:0)-xo*18}px)`;
  // title words pop sequentially
  s.tws.forEach((w,j)=>{const p=clamp((t-s.t0-0.08-j*0.07)/0.3);w.style.opacity=clamp(p*2.5);w.style.transform=`translateY(${(1-eob(p))*12}px) scale(${0.85+0.15*eob(p)})`;});
  s.els.forEach(o=>{
   const p=clamp((t-o.t)/0.4);
   if(t<o.t){o.el.style.opacity=0;return}
   if(o.kind==='fade'){o.el.style.opacity=eo(p);return}
   if(o.kind==='row'){o.el.style.opacity=eo(p);o.el.style.transform=`translateX(${(1-eo(p))*-30}px)`;return}
   if(o.kind==='swipe'){const c=((t-o.t)%1.4)/1.4,up=c<0.45?eo(c/0.45):1;o.el.style.opacity=c<0.85?1:1-(c-0.85)/0.15;o.el.style.transform=`translateY(${-up*60}px)`;
     s.div.querySelector('#feed').style.transform=`translateY(${-up*120}px)`;return}
   if(o.kind==='btn'){o.el.style.opacity=clamp(p*3);o.el.style.transform=`scale(${(0.6+0.4*eob(p))*(1+0.05*Math.sin(t*7))})`;return}
   if(o.kind==='tap'){const c=((t-o.t)%1.0),pr=c<0.15?c/0.15:c<0.3?1-(c-0.15)/0.15:0;o.el.style.opacity=eo(p);o.el.style.transform=`translate(${-pr*4}px,${-pr*8+(1-eo(p))*30}px) scale(${1-pr*0.1})`;return}
   if(o.kind==='price'){o.el.style.opacity=clamp(p*3);o.el.style.transform=`scale(${0.5+0.5*eob(p)}) rotate(${-6+Math.sin((t-o.t)*5)*2}deg)`;return}
   o.el.style.opacity=clamp(p*3); o.el.style.transform=`scale(${0.5+0.5*eob(p)})`;
  });
  if(s.card==='views'){const tc=wtime(s,'өспей');s.div.querySelector('#vn').textContent=Math.round(312-(312-48)*eo(clamp((t-tc)/0.8)));}
  if(s.card==='timer'){const q=clamp((t-s.t0-0.1)/1.5);s.div.querySelector('#tr').style.strokeDashoffset=314*(1-q);s.div.querySelector('#tn').textContent=Math.min(3,Math.floor(q*3.02));}
  if(s.card==='anim'){s.div.querySelector('#ph2').style.left=(10+((t-s.t0)*50)%110)+'px';}
  if(s.card==='visual'){const u=t-s.t0;['#e2','#e3'].forEach((q,k)=>{const e=s.div.querySelector(q);if(e.style.opacity>0)e.style.transform+=` rotate(${Math.sin(u*4+k)*15}deg)`;});}
  if(s.card==='standout'){const te=wtime(s,'ерекшелендіретін'),q=eob(clamp((t-te)/0.4));
   for(let k=0;k<6;k++){const e=s.div.querySelector('#g'+k),ap=clamp((t-s.t0-0.06*k)/0.3);
    if(k===4&&t>=te){e.style.background='linear-gradient(135deg,#E8B84A,#C0583B)';e.style.transform=`scale(${1+0.25*q})`;e.style.boxShadow='0 4px 10px rgba(160,70,40,.35)';e.style.opacity=1;e.style.position='relative';e.style.zIndex=2;}
    else{e.style.background='#D2C3B3';e.style.boxShadow='none';e.style.transform=`scale(${0.6+0.4*eob(ap)})`;e.style.opacity=(t>=te?0.6:1)*ap;}}}
 });
 // subtitles
 const sub=$('#sub'); let html='';
 const ws=S.words; let ci=0; S.ch.forEach((c,k)=>{if(t>=ws[c[0]].t-0.05) ci=k;});
 const c=S.ch[ci];
 if(t>=ws[c[0]].t-0.12 && t<S.t1-0.05){
  html='<div class="ln">'+c.map(j=>{const w=ws[j],nx=ws[j+1];const act=t>=w.t&&(!nx||t<nx.t)&&t<w.t+1.0;return `<span class="${act?'act':''}">${w.w}${w.p||''}</span>`;}).join(' ')+'</div>';
 }
 if(sub.innerHTML!==html) sub.innerHTML=html;
 const lp=clamp((t-ws[c[0]].t+0.12)/0.2); sub.style.transform=`scale(${0.9+0.1*eob(lp)})`;
 drawPerson(t,cur,t-S.t0);
 $('#pfx').style.display=(S.pose==='wow'&&Math.floor(t*4)%2===0)?'':'none';
}
function events(){const ev=[];D.scenes.forEach((s,i)=>{if(i)ev.push([s.t0,'whoosh']);
 s.els.forEach(o=>{if(o.t>=s.t1-0.05)return;const k=o.kind==='row'?'tick':o.kind==='price'?'cash':o.kind==='tap'?'click':o.kind==='swipe'?'swish':o.kind==='fade'?null:'pop';if(k)ev.push([o.t,k]);});
 if(s.card==='timer'){for(let k=1;k<=3;k++)ev.push([s.t0+0.1+1.5*k/3,'tick']);}
 if(s.card==='standout')ev.push([wtime(s,'ерекшелендіретін'),'sparkle']);});return ev.sort((a,b)=>a[0]-b[0]);}
window.events=events;window.setup=setup;window.draw=draw;
</script></body></html>
