<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:IDB;src:url(fonts/InterDisplay-Black.otf);font-weight:900}
@font-face{font-family:IDB;src:url(fonts/InterDisplay-ExtraBold.otf);font-weight:800}
@font-face{font-family:IDB;src:url(fonts/InterDisplay-Bold.otf);font-weight:700}
@font-face{font-family:IDB;src:url(fonts/InterDisplay-SemiBold.otf);font-weight:600}
@font-face{font-family:MONO;src:url(fonts/JetBrainsMono-Bold.ttf);font-weight:700}
@font-face{font-family:SER;font-style:italic;font-weight:700;src:url(fonts/serif-cyrext.woff2) format('woff2');unicode-range:U+0460-052F,U+1C80-1C88,U+20B4,U+2DE0-2DFF,U+A640-A69F,U+FE2E-FE2F}
@font-face{font-family:SER;font-style:italic;font-weight:700;src:url(fonts/serif-cyr.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:SER;font-style:italic;font-weight:700;src:url(fonts/serif-lat.woff2) format('woff2')}
:root{--acc:#FF5A1F;--acc2:#FF7A3D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:360px;height:640px;overflow:hidden;background:#0c0a0a}
#st{position:absolute;inset:0;overflow:hidden;font-family:IDB;color:#fff}
.bg{position:absolute;inset:0;background:
 radial-gradient(48% 26% at 50% 72%,rgba(255,110,50,.26),rgba(255,90,31,0) 70%),
 radial-gradient(90% 60% at 50% 0%,#1d1918,#0c0a0a 70%)}
.cube{position:absolute;border-radius:16px;background:linear-gradient(145deg,#2a2524,#121010);box-shadow:inset 1px 1px 0 rgba(255,255,255,.06),0 20px 40px rgba(0,0,0,.6)}
.vig{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.65));pointer-events:none}
.tag{position:absolute;left:22px;top:30px;font:700 8.5px MONO;letter-spacing:2.2px;color:#8a8380;text-transform:uppercase;display:flex;align-items:center;gap:6px}
.tag i{width:5px;height:5px;border-radius:50%;background:var(--acc);display:block;box-shadow:0 0 6px var(--acc)}
.title{position:absolute;left:22px;right:22px;top:46px;font-weight:900;font-size:31px;line-height:1.02;letter-spacing:-.9px}
.title span{display:inline-block;margin-right:7px;will-change:transform}
.title .e{color:var(--acc)}
.card{position:absolute;left:22px;right:22px;top:104px;height:200px}
.glass{position:absolute;background:linear-gradient(180deg,rgba(38,33,32,.92),rgba(22,19,19,.92));border:1px solid rgba(255,255,255,.07);border-radius:14px;box-shadow:0 18px 40px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}
.bar{position:absolute;left:12px;top:10px;font:700 7.5px MONO;color:#7d7572;letter-spacing:1px;display:flex;gap:4px;align-items:center}
.bar b{width:5px;height:5px;border-radius:50%;background:#3b3534;display:inline-block}
.mono{font-family:MONO;font-weight:700}
.sub{position:absolute;left:10px;right:10px;top:316px;height:34px;text-align:center;font-weight:800;font-size:21px;letter-spacing:-.4px;white-space:nowrap}
.sub span{display:inline-block;margin:0 3px;transition:none}
.sub .e{font-family:SER;font-style:italic;font-weight:700;color:var(--acc);font-size:23px;letter-spacing:0}
.desk{position:absolute;left:0;right:0;top:522px;bottom:0;background:linear-gradient(180deg,#141111,#090808 40%);border-top:1px solid rgba(255,255,255,.06)}
.desk .ln{position:absolute;left:14px;right:0;top:14px;height:2px;background:rgba(255,90,31,.18);border-radius:2px}
.desk .ln i{position:absolute;left:0;top:0;bottom:0;background:var(--acc);box-shadow:0 0 8px var(--acc);border-radius:2px}
.rec{position:absolute;left:14px;bottom:28px;padding:5px 9px;border-radius:10px;background:#161212;border:1px solid rgba(255,255,255,.07);font:700 8px MONO;letter-spacing:1.5px;color:#d8d0cc;display:flex;align-items:center;gap:6px}
.rec i{width:6px;height:6px;border-radius:50%;background:#ff3b30;display:block}
#robot{position:absolute;left:0;top:0;width:360px;height:640px;overflow:visible}
.btn{position:absolute;left:50%;top:70px;transform:translateX(-50%);padding:14px 34px;border-radius:40px;background:linear-gradient(180deg,#ff6a2e,#f24b12);font-weight:900;font-size:27px;letter-spacing:-.5px;color:#fff;white-space:nowrap;box-shadow:0 10px 30px rgba(255,90,31,.45),inset 0 1px 0 rgba(255,255,255,.35)}
</style></head>
<body><div id="st">
 <div class="bg"></div>
 <div id="cubes"></div>
 <div class="vig"></div>
 <div class="tag"><i></i><span id="tagt"></span></div>
 <div id="titles"></div>
 <div id="cards"></div>
 <div class="sub" id="sub"></div>
 <svg id="robot" viewBox="0 0 360 640"></svg>
 <div class="desk"><div class="ln"><i id="prog"></i></div><div class="rec"><i id="recdot"></i>REC · <span id="rect"></span></div></div>
</div>
<script>
const $=s=>document.querySelector(s);
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=cl(x);return 1-Math.pow(1-x,3)};
const back=x=>{x=cl(x);const c=1.7;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const lerp=(a,b,k)=>a+(b-a)*k;
const norm=s=>s.toLowerCase().replace(/[^0-9a-zа-яёәғқңөұүһі]/g,'');
let D,S=[];
const SVGNS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function h(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild}
const CHECK='<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 5.2l2 2 4-4.4" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const CROSS='<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 2.5l5 5M7.5 2.5l-5 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>';
function icon(k){
 const s='stroke="#cfc6c2" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"';
 if(k==='laptop')return `<svg width="20" height="20" viewBox="0 0 20 20"><rect x="3.5" y="4.5" width="13" height="8.5" rx="1.5" ${s}/><path d="M1.5 15.5h17" ${s}/></svg>`;
 if(k==='cut')return `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="5.5" cy="14.5" r="2.5" ${s}/><circle cx="14.5" cy="14.5" r="2.5" ${s}/><path d="M7.3 12.7L15 3M12.7 12.7L5 3" ${s}/></svg>`;
 if(k==='layers')return `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 3l7 3.8-7 3.8-7-3.8z" ${s}/><path d="M3 10.3l7 3.8 7-3.8M3 13.6l7 3.8 7-3.8" ${s}/></svg>`;
 if(k==='text')return `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M4 5h12M10 5v11" ${s}/></svg>`;
 if(k==='anim')return `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="13" cy="10" r="4" ${s}/><path d="M2 7h5M3 10h4M2 13h5" ${s}/></svg>`;
 if(k==='fx')return `<svg width="20" height="20" viewBox="0 0 20 20"><path d="M10 2.5l1.8 4.7 4.7 1.8-4.7 1.8L10 15.5l-1.8-4.7L3.5 9l4.7-1.8z" ${s}/></svg>`;
 return '';
}
function wordT(sc,pred,def){const w=sc.words.find(pred);return w?w.t:def}
// ---------------------------------------------------------------- карточкалар
function buildCard(sc,i){
 const c=h('<div class="card"></div>');const k=sc.card;sc.parts={};
 if(k==='player'){
  c.innerHTML=`<div class="glass" style="left:0;right:0;top:0;bottom:0">
   <div class="bar"><b></b><b></b><b></b>&nbsp; reels_final.mp4</div>
   <div style="position:absolute;left:12px;right:12px;top:28px;bottom:42px;border-radius:9px;overflow:hidden;background:#0a0808">
    <div class="pv" style="position:absolute;inset:-30px;background:radial-gradient(40% 50% at 30% 40%,rgba(255,90,31,.75),transparent 70%),radial-gradient(45% 55% at 75% 65%,rgba(140,60,255,.55),transparent 70%),radial-gradient(30% 40% at 60% 20%,rgba(255,200,120,.35),transparent 70%);filter:blur(6px)"></div>
    <div style="position:absolute;left:12px;top:10px;font:700 7px MONO;letter-spacing:1.5px;color:rgba(255,255,255,.75)">● REC</div>
    <div class="play" style="position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(255,255,255,.95);box-shadow:0 0 0 8px rgba(255,255,255,.15)">
     <svg width="46" height="46" viewBox="0 0 46 46"><path d="M19 15l13 8-13 8z" fill="#FF5A1F"/></svg></div>
   </div>
   <div style="position:absolute;left:12px;right:12px;bottom:26px;height:3px;border-radius:3px;background:#2f2928"><i class="pb" style="position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--acc);box-shadow:0 0 6px var(--acc)"></i></div>
   <div class="tc mono" style="position:absolute;left:12px;bottom:9px;font-size:7.5px;color:#8a817e;letter-spacing:1px">00:00 / 00:26</div>
   <div class="mono" style="position:absolute;right:12px;bottom:9px;font-size:7.5px;color:var(--acc);letter-spacing:1px">1080×1920</div></div>`;
 }
 if(k==='phone'){
  c.innerHTML=`<div class="ph" style="position:absolute;left:50%;top:-6px;width:124px;height:214px;margin-left:-62px;border-radius:24px;background:linear-gradient(160deg,#3a3332,#141111);padding:5px;box-shadow:0 20px 40px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08)">
   <div style="position:relative;width:100%;height:100%;border-radius:20px;background:#0f0d0d;overflow:hidden">
    <div style="position:absolute;left:50%;top:6px;width:34px;height:9px;margin-left:-17px;border-radius:6px;background:#000"></div>
    <div style="position:absolute;left:10px;top:24px;font-size:9px;font-weight:800;display:flex;align-items:center;gap:5px"><i style="width:12px;height:12px;border-radius:50%;background:var(--acc);display:block"></i>Claude</div>
    <div class="b1" style="position:absolute;right:8px;top:48px;padding:6px 8px;border-radius:10px 10px 2px 10px;background:var(--acc);font-size:7.5px;font-weight:700">Видеоны монтажда</div>
    <div class="b2" style="position:absolute;left:8px;top:76px;width:84px;padding:7px;border-radius:10px 10px 10px 2px;background:#211c1b">
      <div style="height:4px;border-radius:2px;background:#3d3534;width:90%"></div>
      <div style="height:4px;border-radius:2px;background:#3d3534;width:70%;margin-top:4px"></div>
      <div style="height:4px;border-radius:2px;background:#3d3534;width:80%;margin-top:4px"></div></div>
    <div class="b3" style="position:absolute;left:8px;top:120px;width:96px;height:56px;border-radius:9px;overflow:hidden;background:radial-gradient(60% 60% at 30% 40%,rgba(255,90,31,.8),transparent 70%),radial-gradient(60% 60% at 80% 70%,rgba(140,60,255,.6),transparent 70%),#1a1515">
      <div style="position:absolute;right:5px;bottom:5px;width:16px;height:16px;border-radius:50%;background:#2ecc71;display:flex;align-items:center;justify-content:center">${CHECK}</div></div>
   </div></div>`;
 }
 if(k==='nolist'){
  const rows=[['laptop','Ноутбук'],['cut','CapCut'],['layers','Күрделі монтаж']];
  c.innerHTML=`<div class="glass" style="left:0;right:0;top:0;height:178px"><div class="bar">ҚАЖЕТ ЕМЕС</div>${rows.map((r,j)=>`
   <div class="row r${j}" style="position:absolute;left:12px;right:12px;top:${30+j*47}px;height:39px;border-radius:9px;background:#1b1716;border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;padding:0 10px;gap:10px">
    ${icon(r[0])}<span style="font-size:15px;font-weight:800;position:relative">${r[1]}<i class="st" style="position:absolute;left:-2px;top:52%;height:2.5px;background:var(--acc);border-radius:2px;width:0"></i></span>
    <span class="x" style="margin-left:auto;width:20px;height:20px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center">${CROSS}</span></div>`).join('')}</div>
   <div class="stamp" style="position:absolute;left:50%;top:66px;transform:translateX(-50%) rotate(-7deg);padding:5px 14px;border:2.5px solid var(--acc);border-radius:8px;color:var(--acc);font-size:24px;font-weight:900;letter-spacing:-.3px;white-space:nowrap;background:rgba(20,16,15,.85);box-shadow:0 0 20px rgba(255,90,31,.3)">ТЕК ТЕЛЕФОН</div>`;
 }
 if(k==='checks'){
  const rows=[['text','Мәтіндер'],['anim','Анимациялар'],['fx','Эффектілер']];
  c.innerHTML=`<div class="glass" style="left:0;right:0;top:0;height:196px"><div class="bar"><b></b><b></b><b></b>&nbsp; claude · монтаж</div>${rows.map((r,j)=>`
   <div class="row r${j}" style="position:absolute;left:12px;right:12px;top:${30+j*44}px;height:36px;border-radius:9px;background:#1b1716;border:1px solid rgba(255,255,255,.05);display:flex;align-items:center;padding:0 10px;gap:9px">
    ${icon(r[0])}<span style="font-size:14px;font-weight:800;width:96px">${r[1]}</span>
    <span style="flex:1;height:3px;border-radius:3px;background:#2f2928;position:relative"><i class="f" style="position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--acc);width:0"></i></span>
    <span class="ok" style="width:18px;height:18px;border-radius:50%;background:var(--acc);display:flex;align-items:center;justify-content:center">${CHECK}</span></div>`).join('')}
   <div class="done mono" style="position:absolute;left:12px;right:12px;bottom:12px;height:22px;border-radius:7px;background:rgba(255,90,31,.12);border:1px dashed rgba(255,90,31,.5);color:var(--acc);font-size:8px;letter-spacing:1.5px;display:flex;align-items:center;justify-content:center">✓ RENDER 100% · CLAUDE</div></div>`;
 }
 if(k==='toggle'){
  c.innerHTML=`<div class="tg" style="position:absolute;left:50%;top:40px;width:120px;height:62px;margin-left:-60px;border-radius:40px;background:#2a2423;box-shadow:inset 0 2px 6px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)">
    <i class="kn" style="position:absolute;top:7px;left:7px;width:48px;height:48px;border-radius:50%;background:linear-gradient(180deg,#5a5352,#2c2726);box-shadow:0 4px 10px rgba(0,0,0,.6)"></i></div>
   <div class="tl mono" style="position:absolute;left:0;right:0;top:116px;text-align:center;font-size:10px;letter-spacing:3px;color:var(--acc)">ҮЙРЕНУ · ҚОСУЛЫ</div>`;
 }
 if(k==='zero'){
  c.innerHTML=`<div class="glass" style="left:0;right:0;top:0;height:178px">
    <div class="mono" style="position:absolute;left:12px;top:10px;font-size:8.5px;letter-spacing:1px;color:var(--acc)">ҚАДАМ <span class="s0">0</span> → <span class="s1">1</span> → <span class="s2">2</span> → <span class="s3">3</span></div>
    <div class="num" style="position:absolute;left:0;right:0;top:34px;text-align:center;font-size:72px;font-weight:900;letter-spacing:-3px">0%</div>
    <div style="position:absolute;left:16px;right:16px;top:128px;height:6px;border-radius:6px;background:#2f2928"><i class="f" style="position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#ff8a4d,var(--acc));box-shadow:0 0 10px var(--acc);width:0"></i></div>
    <div class="mono" style="position:absolute;left:16px;right:16px;top:144px;display:flex;justify-content:space-between;font-size:8px;letter-spacing:1px;color:#8a817e"><span>НӨЛ</span><span>ТЕЛЕФОН</span><span style="color:var(--acc)">МОНТАЖ</span></div></div>`;
 }
 if(k==='cta'){
  c.innerHTML=`<div class="btn">${sc.button||'Подробнее'}</div>
   <div class="ser" style="position:absolute;left:0;right:0;top:146px;text-align:center;font-family:SER;font-style:italic;font-weight:700;font-size:22px;color:var(--acc)">толық ақпарат <span style="font-family:IDB;font-style:normal;font-weight:800;font-size:19px;color:#fff">осында</span></div>
   <div class="arr" style="position:absolute;left:50%;top:-18px;margin-left:-10px"></div>`;
 }
 $('#cards').appendChild(c);return c;
}
function drawCard(sc,lt,t){
 const c=sc.el,k=sc.card;
 if(k==='player'){
  const d=sc.t1-sc.t0;const p=cl(lt/d);
  c.querySelector('.pb').style.width=(p*100)+'%';
  const tt=Math.floor(t);c.querySelector('.tc').textContent=`00:${String(tt).padStart(2,'0')} / 00:${String(Math.round(D.dur-1)).padStart(2,'0')}`;
  const pl=c.querySelector('.play');const s=1+0.06*Math.sin(t*6);pl.style.transform=`scale(${s*back(lt/0.45)})`;
  c.querySelector('.pv').style.transform=`translate(${Math.sin(t*.9)*12}px,${Math.cos(t*.7)*8}px) scale(1.1)`;
 }
 if(k==='phone'){
  const ph=c.querySelector('.ph');ph.style.transform=`translateY(${Math.sin(t*1.6)*2}px) rotate(${Math.sin(t*.8)*1.2}deg)`;
  const tp=wordT(sc,w=>norm(w.w).startsWith('телефон'),sc.t0+1.5);
  const a=[[ '.b1',sc.t0+0.25],['.b2',sc.t0+0.9],['.b3',tp-0.1]];
  for(const [q,ta] of a){const e=c.querySelector(q);const k2=ease((t-ta)/0.3);e.style.opacity=k2;e.style.transform=`translateY(${(1-k2)*8}px) scale(${0.9+0.1*back((t-ta)/0.35)})`}
 }
 if(k==='nolist'){
  const ts=[sc.words[0].t,sc.words[1].t,sc.words[2].t];
  ts.forEach((ta,j)=>{const r=c.querySelector('.r'+j);const k1=ease((t-(sc.t0+0.1+j*0.12))/0.3);r.style.opacity=k1;r.style.transform=`translateX(${(1-k1)*-14}px)`;
   const k2=ease((t-ta-0.15)/0.3);r.querySelector('.st').style.width=`calc(${k2*100}% + 4px)`;r.style.opacity=k1*(1-0.45*k2);
   const x=r.querySelector('.x');x.style.transform=`scale(${back((t-ta-0.15)/0.3)})`;});
  const st=c.querySelector('.stamp');const ta=sc.words[sc.words.length-1].t+0.35;const k3=cl((t-ta)/0.18);
  st.style.opacity=k3;st.style.transform=`translateX(-50%) rotate(-7deg) scale(${lerp(1.8,1,ease(k3))})`;
 }
 if(k==='checks'){
  const es=sc.words.filter(w=>w.e);
  for(let j=0;j<3;j++){const r=c.querySelector('.r'+j);const ta=es[j]?es[j].t:sc.t0+j;
   const k1=ease((t-(ta-0.35))/0.3);r.style.opacity=0.25+0.75*k1;r.style.transform=`translateX(${(1-k1)*-10}px)`;
   r.querySelector('.f').style.width=(ease((t-ta+0.2)/0.6)*100)+'%';r.querySelector('.ok').style.transform=`scale(${back((t-ta-0.4)/0.3)})`;}
  const tj=wordT(sc,w=>norm(w.w).startsWith('барлығ'),sc.t1-1);const dn=c.querySelector('.done');const k4=ease((t-tj)/0.3);dn.style.opacity=k4;dn.style.transform=`scale(${0.9+0.1*back((t-tj)/0.35)})`;
 }
 if(k==='toggle'){
  const ta=wordT(sc,w=>w.e,sc.t0+1);const k1=ease((t-ta)/0.35);
  const kn=c.querySelector('.kn');kn.style.left=(7+k1*58)+'px';kn.style.background=k1>.5?'linear-gradient(180deg,#fff,#e9e2df)':'linear-gradient(180deg,#5a5352,#2c2726)';
  const tg=c.querySelector('.tg');tg.style.background=`rgb(${lerp(42,255,k1)|0},${lerp(36,90,k1)|0},${lerp(35,31,k1)|0})`;tg.style.boxShadow=`inset 0 2px 6px rgba(0,0,0,${0.6-0.4*k1}),0 0 ${30*k1}px rgba(255,90,31,${0.55*k1})`;
  const tl=c.querySelector('.tl');tl.style.opacity=k1;tl.style.transform=`translateY(${(1-k1)*6}px)`;
  const tgS=c.querySelector('.tg');tgS.style.transform=`scale(${0.85+0.15*back((t-sc.t0)/0.4)})`;
 }
 if(k==='zero'){
  const ta=wordT(sc,w=>norm(w.w).startsWith('нөл'),sc.t0+1);const te=sc.t1-0.4;const p=ease((t-ta)/Math.max(0.6,te-ta));
  c.querySelector('.num').textContent=Math.round(p*100)+'%';c.querySelector('.f').style.width=(p*100)+'%';
  for(let j=0;j<4;j++){const s=c.querySelector('.s'+j);s.style.color=p>=j/3-0.001&&t>=ta?'#fff':'#7d3a22'}
 }
 if(k==='cta'){
  const b=c.querySelector('.btn');const s=back((lt-0.05)/0.45);const pulse=1+0.045*Math.max(0,Math.sin(t*5));

 // сахна позасы

 const cur=POSES[S[si].pose]||POSES.talk,prev=si>0?(POSES[S[si-1].pose]||POSES.talk):cur;

let MC;function mw(txt,font){MC=MC||document.createElement('canvas').getContext('2d');MC.font=font;return MC.measureText(txt).width}
function chunks(words){
 const out=[];let cur=[],w=0;
 for(const x of words){const s=(x.w+(x.p||''));const ww=mw(s,x.e?'italic 700 23px SER':'800 21px IDB')+7;
  if(cur.length&&(w+ww>318||cur.length>=4)){out.push(cur);cur=[];w=0}
  cur.push(x);w+=ww;if(/[.!?,—]$/.test(s)&&w>150){out.push(cur);cur=[];w=0}}
 if(cur.length)out.push(cur);
 // ұзын тізбектің соңғы жалғыз сөзі
 return out;
}
